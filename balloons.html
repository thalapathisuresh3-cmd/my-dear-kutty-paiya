<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop the Balloons ❤️</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="stars"></div>

<div class="page">
  <div class="card">
    <p class="eyebrow">Chapter two</p>
    <h1>Pop all 4 balloons</h1>

    <div class="balloon-grid">
      <div class="balloon red"><span>You are</span></div>
      <div class="balloon blue"><span>my</span></div>
      <div class="balloon yellow"><span>forever</span></div>
      <div class="balloon pink"><span>headache😂</span></div>
    </div>

    <p class="status" id="status">Balloons popped: 0 / 4</p>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
