<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="stars"></div>

<div class="page">
  <div class="card">
    <p class="eyebrow">A little surprise</p>
    <h1 class="title-sub">Happy Birthday</h1>
    <h2 class="title-name script">Jossika</h2>
    <p class="nickname">(my Kutty Paiya) ❤️</p>

    <img class="ph" src="images/jossika.jpg" alt="Jossika"
         onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23341b45%22/><text x=%2250%25%22 y=%2255%25%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23ff5d8f%22>❤</text></svg>'">

    <p class="question">Are you excited for what's next?</p>
    <div class="buttons">
      <button class="btn yesBtn">YES ❤️</button>
      <button class="btn btn-ghost noBtn">NO 😅</button>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
