<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Moments ❤️</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="stars"></div>

<div class="page">
  <div class="card">
    <p class="eyebrow">Chapter six</p>
    <h1>Some sweet moments</h1>

    <div class="card-stack">
      <div class="photo-card">
        <img src="images/photo1.jpg" alt="Memory 1" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
      <div class="photo-card">
        <img src="images/photo2.jpg" alt="Memory 2" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
      <div class="photo-card">
        <img src="images/photo3.jpg" alt="Memory 3" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
      <div class="photo-card">
        <img src="images/photo4.jpg" alt="Memory 4" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
      <div class="photo-card">
        <img src="images/photo5.jpg" alt="Memory 5" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
      <div class="photo-card">
        <img src="images/photo6.jpg" alt="Memory 6" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'📸'}))">
      </div>
    </div>

    <p class="swipe-hint" id="swipeHint">Swipe the cards →</p>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
