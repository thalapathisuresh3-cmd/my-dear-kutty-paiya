<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Moments ❤️</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="memory-page">
<div class="memory-container">
<h1 class="memory-title">
Some Sweet Moments ❤️
</h1>
<p class="memory-subtitle">
Swipe the cards →
</p>
<div id="cards">
</div>
<p id="swipeText">
Swipe this photo →
</p>
</div>
<script>
/* Build 39 cards automatically (photo1.jpg to photo39.jpg) */
const cardsContainer = document.getElementById("cards");
const totalPhotos = 39;
for(let i = 1; i <= totalPhotos; i++){
    let card = document.createElement("div");
    card.className = "photo-card";
    let img = document.createElement("img");
    img.src = "images/photo" + i + ".jpg";
    card.appendChild(img);
    cardsContainer.appendChild(card);
}

const cards = document.querySelectorAll(".photo-card");
let current = 0;
const perSwipe = 3;

function showCard(){
    cards.forEach((card, index) => {
        card.style.display = (index >= current && index < current + perSwipe) ? "block" : "none";
    });
}
showCard();

function goNext(){
    current += perSwipe;
    if(current < cards.length){
        showCard();
    } else {
        window.location.href = "letter.html";
    }
}

document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
        goNext();
    }
});

let startX = 0;
document.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});
document.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;
    if(Math.abs(startX - endX) > 60){
        goNext();
    }
});

cardsContainer.addEventListener("click", goNext);
</script>
<script src="js/script.js"></script>
</body>
</html>
